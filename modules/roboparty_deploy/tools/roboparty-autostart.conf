# 设为 1 才会真正启动机器人；0 时服务只记录“已关闭”并安全退出。
AUTOSTART_ENABLED=1

# 生产启动建议保持为 0。源码更新后应先手动编译和验证。
BUILD_ON_START=0

ROBOT=rpo
POLICY=default

# 给 udev 和 CAN 设备留出初始化时间。
STARTUP_DELAY_SEC=8

# Eye 使用独立的 systemd 服务；这个开关不影响机器人服务。
EYE_AUTOSTART_ENABLED=1
EYE_PROGRAM_DIR=/home/limrobot/Project/roboparty_xlong/roboto_origin/modules/roboparty_display/eyecontrol
EYE_DISPLAY=:0
EYE_XAUTHORITY=/run/user/1000/gdm/Xauthority
EYE_STARTUP_TIMEOUT_SEC=60
